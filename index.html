<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSAP Horizontal Scroll</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <section class="hero">
            <span class="label">CREATIVE STUDIO — 2026</span>
            <h1>Explore<br>Beyond.</h1>
            <p>Scroll down to explore the collection ↓</p>
        </section>

        <section class="horizontal-section" id="horizontal">
            <div class="pin-wrap">

                <div class="intro">
                    <span>01 / INTRODUCTION</span>
                    <h2>Design is<br>everywhere.</h2>
                </div>

                <div class="panel">
                    <img src="https://images.pexels.com/photos/5207262/pexels-photo-5207262.jpeg?auto=compress&cs=tinysrgb&w=1200"
                        alt="Interior design">
                    <span>01 — INTERIOR</span>
                </div>

                <div class="panel">
                    <img src="https://images.pexels.com/photos/3371358/pexels-photo-3371358.jpeg?auto=compress&cs=tinysrgb&w=1200"
                        alt="Architecture">
                    <span>02 — ARCHITECTURE</span>
                </div>

                <div class="panel">
                    <img src="https://images.pexels.com/photos/3618545/pexels-photo-3618545.jpeg?auto=compress&cs=tinysrgb&w=1200"
                        alt="Creative space">
                    <span>03 — CREATIVE SPACE</span>
                </div>

                <div class="intro">
                    <span>02 / THE END</span>
                    <h2>Keep<br>creating.</h2>
                </div>

            </div>
        </section>

        <section class="footer">
            <span>END OF COLLECTION</span>
            <h2>Thank you.</h2>
            <p>© 2026 — CREATIVE STUDIO</p>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>

</body>

</html>
